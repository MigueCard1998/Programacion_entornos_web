<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de perfil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <article class="tarjeta">
    <img class="foto" src="perfil.png" alt="Retrato de Miguel Cardona con gorra, mirando hacia arriba y sonriendo">
    <h2 class="nombre">Miguel Cardona</h2>
    <p class="cargo">Desarrollador Front-end</p>
    <div class="botones">
      <button type="button" class="btn btn-primario">Contactar</button>
      <button type="button" class="btn btn-secundario">Portafolio</button>
    </div>
  </article>
</body>
</html>
